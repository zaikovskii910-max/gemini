<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gemini</title>
<style>
:root{
  --bg:#131313; --surface:#1e1f20; --surface-2:#282a2c; --surface-3:#333537;
  --border:rgba(255,255,255,.09); --text:#e3e3e3; --dim:#9aa0a6;
  --accent:#8ab4f8; --blue:#4285f4; --radius:28px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:"Google Sans","Product Sans",Roboto,"Segoe UI",system-ui,sans-serif;
  font-size:14px; overflow:hidden;
}
#app{display:flex; height:100%}
button{font:inherit; color:inherit; background:none; border:none; cursor:pointer}
svg.ic{width:20px;height:20px;flex:none}
::-webkit-scrollbar{width:10px}
::-webkit-scrollbar-thumb{background:#3c4043;border-radius:6px;border:2px solid var(--bg)}
::-webkit-scrollbar-track{background:transparent}

/* ---------- сайдбар ---------- */
#sidebar{width:268px; padding:12px; display:flex; flex-direction:column; gap:6px;
  border-right:1px solid rgba(255,255,255,.06);}
.logo-row{display:flex;align-items:center;gap:8px;padding:10px 12px 14px}
.logo-row .logo{width:26px;height:26px}
.logo-text{font-size:22px;font-weight:500;letter-spacing:.2px}
.new-chat{display:flex;align-items:center;gap:12px;background:var(--surface);
  border:1px solid var(--border);border-radius:24px;padding:13px 18px;
  font-size:14px;font-weight:500;transition:background .15s}
.new-chat:hover{background:var(--surface-2)}
.nav-label{color:var(--dim);font-size:12px;padding:16px 14px 6px;display:flex;
  justify-content:space-between;align-items:center}
.chat-list{flex:1;overflow-y:auto;margin:0 -4px;padding:0 4px}
.chat-item{display:flex;align-items:center;gap:8px;padding:10px 12px 10px 14px;
  border-radius:20px;cursor:pointer;color:#dadce0;font-size:13.5px;margin-bottom:2px}
.chat-item:hover,.chat-item.active{background:var(--surface-2)}
.chat-item .t{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chat-item .dots{opacity:0;border-radius:50%;padding:2px 5px;color:var(--dim)}
.chat-item:hover .dots{opacity:1}
.chat-item .dots:hover{background:var(--surface-3);color:var(--text)}
.side-bottom{border-top:1px solid rgba(255,255,255,.06);padding-top:8px;display:flex;flex-direction:column;gap:2px}
.side-link{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:20px;color:#dadce0;font-size:13.5px;text-align:left}
.side-link:hover{background:var(--surface-2)}
.profile{display:flex;align-items:center;gap:12px;padding:10px 14px;color:var(--dim);font-size:13px}
.avatar{width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,#4285f4,#9b72e8);
  color:#fff;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600}

/* ---------- основная область ---------- */
#main{flex:1;display:flex;flex-direction:column;position:relative;min-width:0}
#main.empty::before{content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(700px 420px at 50% 42%,rgba(66,133,244,.16),rgba(155,114,232,.07) 45%,transparent 70%);}
#messages{flex:1;overflow-y:auto;display:none;padding:28px 12px 8px}
#main:not(.empty) #messages{display:block}
#hero{display:none;flex:1;align-items:center;justify-content:center;flex-direction:column;gap:8px}
#main.empty #hero{display:flex}
#hero h1{font-size:44px;font-weight:500;margin:0;color:#e8eaed;
  text-shadow:0 0 60px rgba(66,133,244,.35)}
#composerWrap{padding:0 16px 14px;position:relative;z-index:2}
#chips{max-width:860px;margin:0 auto 8px;display:flex;flex-wrap:wrap;gap:8px}
.chip{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--border);
  border-radius:12px;padding:6px 10px;font-size:12.5px;color:#dadce0}
.chip img{width:26px;height:26px;border-radius:6px;object-fit:cover}
.chip button{color:var(--dim);font-size:14px;line-height:1}
.chip button:hover{color:#f28b82}
#composer{max-width:860px;margin:0 auto;background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius);padding:10px 12px 10px 10px;display:flex;align-items:flex-end;gap:6px;
  box-shadow:0 6px 28px rgba(0,0,0,.4);transition:border-color .15s}
#composer:focus-within{border-color:rgba(138,180,248,.45)}
.round-btn{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  color:var(--dim);flex:none;transition:background .15s,color .15s}
.round-btn:hover{background:var(--surface-2);color:var(--text)}
#input{flex:1;background:transparent;border:none;outline:none;resize:none;color:var(--text);
  font:inherit;font-size:15px;line-height:1.5;padding:10px 4px;max-height:200px}
#input::placeholder{color:var(--dim)}
.model-btn{display:flex;align-items:center;gap:6px;color:var(--dim);font-size:13px;
  padding:9px 12px;border-radius:18px;margin-bottom:1px}
.model-btn:hover{background:var(--surface-2);color:var(--text)}
#sendBtn{background:var(--surface-2);color:var(--dim)}
#sendBtn.on{background:#e8eaed;color:#131313}
#sendBtn.on:hover{background:#fff}
#stopBtn{background:#e8eaed;color:#131313}
.hint{text-align:center;color:#5f6368;font-size:12px;margin-top:10px}

/* ---------- сообщения ---------- */
.col{max-width:860px;margin:0 auto}
.msg-user{display:flex;justify-content:flex-end;margin:14px 0}
.msg-user .bubble{background:var(--surface-2);border-radius:20px;padding:12px 20px;max-width:72%;
  white-space:pre-wrap;font-size:15px;line-height:1.55}
.msg-user .thumbs{margin-bottom:8px;display:flex;gap:8px;flex-wrap:wrap}
.msg-user .thumbs img{max-width:220px;max-height:160px;border-radius:12px}
.msg-user .fchip{background:var(--surface-3);border-radius:10px;padding:5px 10px;font-size:12.5px}
.msg-model{margin:20px 0;position:relative}
.msg-model .content{font-size:16px;line-height:1.7;min-height:8px}
.msg-model .acts{display:flex;gap:4px;margin-top:8px;opacity:0;transition:opacity .15s}
.msg-model:hover .acts{opacity:1}
.acts button{color:var(--dim);border-radius:50%;width:32px;height:32px;display:flex;align-items:center;justify-content:center}
.acts button:hover{background:var(--surface-2);color:var(--text)}
.thinking{color:var(--accent);font-size:20px;animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.35;transform:scale(.92)}50%{opacity:1;transform:scale(1.06)}}
.cursor{display:inline-block;width:9px;height:18px;background:var(--accent);vertical-align:-3px;
  margin-left:2px;animation:blink .9s steps(1) infinite;border-radius:2px}
@keyframes blink{50%{opacity:0}}
.err{color:#f28b82;background:rgba(242,139,130,.08);border:1px solid rgba(242,139,130,.35);
  border-radius:12px;padding:10px 14px}

/* ---------- контент ---------- */
.content h1,.content h2,.content h3,.content h4{margin:.9em 0 .45em;line-height:1.35}
.content p{margin:.5em 0}
.content ul,.content ol{padding-left:1.6em;margin:.5em 0}
.content a{color:var(--accent)}
.content blockquote{border-left:3px solid var(--accent);margin:.7em 0;padding:.2em 1em;color:#c6c9cc;background:rgba(138,180,248,.06);border-radius:0 10px 10px 0}
.content table{border-collapse:collapse;margin:.7em 0;display:block;overflow-x:auto}
.content th,.content td{border:1px solid #3c4043;padding:6px 12px}
.content th{background:var(--surface-2)}
.content code{font-family:"JetBrains Mono",Consolas,monospace;font-size:.9em}
.content .inline-code,.content :not(pre)>code{background:var(--surface-2);padding:2px 7px;border-radius:7px}
.content pre{position:relative;background:var(--surface);border:1px solid var(--border);
  border-radius:14px;padding:14px 16px;overflow:auto;margin:.7em 0}
.content pre code{background:none;padding:0;font-size:13px;line-height:1.6}
.copy-btn{position:absolute;top:8px;right:8px;background:var(--surface-2);color:var(--dim);
  border:1px solid var(--border);border-radius:8px;padding:3px 10px;font-size:12px}
.copy-btn:hover{color:var(--text);background:var(--surface-3)}
.katex-display{overflow-x:auto;overflow-y:hidden;padding:6px 0;margin:.7em 0}
.math-block{text-align:center;margin:.7em 0;overflow-x:auto}
img.math-inline,img.math-block-img{vertical-align:middle;max-width:100%}

/* ---------- выполнение кода ---------- */
.exec-wrap{border:1px solid var(--border);border-radius:14px;overflow:hidden;margin:.8em 0;background:var(--surface)}
.exec-head{display:flex;align-items:center;gap:8px;padding:8px 14px;background:var(--surface-2);
  color:var(--dim);font-size:12.5px}
.exec-wrap pre{border:none;border-radius:0;margin:0;border-top:1px solid var(--border);background:#17181a}
.exec-out{border-top:1px solid var(--border);padding:10px 14px;font-family:"JetBrains Mono",Consolas,monospace;
  font-size:13px;line-height:1.55;white-space:pre-wrap;background:#17181a}
.exec-out.fail{color:#f28b82}
.exec-badge{margin-left:auto;border-radius:8px;padding:2px 9px;font-size:11.5px}
.exec-badge.ok{background:rgba(129,201,149,.15);color:#81c995}
.exec-badge.fail{background:rgba(242,139,130,.15);color:#f28b82}

/* hljs */
.hljs{color:#e8eaed}
.hljs-comment,.hljs-quote{color:#8a919c;font-style:italic}
.hljs-keyword,.hljs-selector-tag,.hljs-literal,.hljs-type{color:#f28b82}
.hljs-string,.hljs-addition,.hljs-attr{color:#a8dab5}
.hljs-number{color:#f6c177}
.hljs-title,.hljs-section,.hljs-name,.hljs-function{color:#8ab4f8}
.hljs-variable,.hljs-template-variable,.hljs-attribute{color:#fdd663}
.hljs-deletion,.hljs-built_in{color:#c586c0}

/* ---------- меню / диалоги ---------- */
.menu{position:fixed;z-index:50;background:var(--surface-2);border:1px solid var(--border);
  border-radius:14px;padding:6px;min-width:230px;box-shadow:0 10px 34px rgba(0,0,0,.5);max-height:320px;overflow-y:auto}
.menu button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;
  padding:9px 12px;border-radius:10px;font-size:13.5px;color:#dadce0}
.menu button:hover{background:var(--surface-3)}
.menu button.sel{color:var(--accent)}
.menu .sep{height:1px;background:var(--border);margin:5px 8px}
dialog{background:var(--surface);color:var(--text);border:1px solid var(--border);
  border-radius:20px;padding:22px;width:520px;max-width:92vw}
dialog[open]{display:block}
dialog::backdrop{background:rgba(0,0,0,.55)}
dialog h2{margin:0 0 14px;font-size:19px;font-weight:500}
dialog label{display:block;color:var(--dim);font-size:12.5px;margin:12px 0 5px}
dialog input,dialog textarea,dialog select{width:100%;background:var(--bg);color:var(--text);
  border:1px solid var(--border);border-radius:10px;padding:9px 12px;font:inherit;outline:none}
dialog input:focus,dialog textarea:focus{border-color:var(--accent)}
.checkline{display:flex;align-items:center;gap:10px;margin-top:16px;color:#dadce0;font-size:13.5px}
.checkline input{width:auto;margin:0}
.dlg-row{display:flex;gap:8px}
.dlg-row input:first-child{flex:1}
.btn{background:var(--surface-2);border:1px solid var(--border);border-radius:18px;padding:8px 18px;font-size:13.5px}
.btn:hover{background:var(--surface-3)}
.btn.primary{background:#8ab4f8;border-color:#8ab4f8;color:#131313;font-weight:600}
.btn.primary:hover{background:#aecbfa}
.dlg-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
.key-row{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:12px;margin-bottom:4px;background:var(--bg)}
.key-row .n{flex:1}
.key-row .k{color:var(--dim);font-size:12px;font-family:monospace}
.key-row.sel{outline:1px solid var(--accent)}
.key-row button{color:var(--dim)}
.key-row button:hover{color:#f28b82}
#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:99;
  background:#e8eaed;color:#131313;border-radius:10px;padding:10px 18px;font-size:13.5px;
  box-shadow:0 8px 24px rgba(0,0,0,.4)}
#jserr{position:fixed;top:0;left:0;right:0;z-index:9999;background:#5c1a1a;color:#ffd7d7;
  padding:10px 16px;font:12px/1.5 monospace;white-space:pre-wrap;display:none}
@media (max-width:820px){#sidebar{display:none}}
</style>
</head>
<body>
<div id="jserr"></div>

<svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg"
     style="position:absolute;width:0;height:0;overflow:hidden">
  <defs><linearGradient id="starGrad" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#4285f4"/><stop offset=".5" stop-color="#9b72e8"/><stop offset="1" stop-color="#d96570"/>
  </linearGradient></defs>
  <symbol id="i-star" viewBox="0 0 24 24"><path fill="url(#starGrad)" d="M12 1.8 14.5 9.5 22.2 12 14.5 14.5 12 22.2 9.5 14.5 1.8 12 9.5 9.5Z"/></symbol>
  <symbol id="i-pen" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M3 21l3.9-.9L20.3 6.7a2.1 2.1 0 0 0-3-3L3.9 17.1 3 21z"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-up" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" d="M12 19V5M5 12l7-7 7 7"/></symbol>
  <symbol id="i-stop" viewBox="0 0 24 24"><rect x="7" y="7" width="10" height="10" rx="2" fill="currentColor"/></symbol>
  <symbol id="i-caret" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M6 9l6 6 6-6"/></symbol>
  <symbol id="i-gear" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M4 7h10M18 7h2M4 17h2M10 17h10M16 5v4M8 15v4"/><circle cx="16" cy="7" r="2.4" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="8" cy="17" r="2.4" fill="none" stroke="currentColor" stroke-width="2"/></symbol>
  <symbol id="i-key" viewBox="0 0 24 24"><circle cx="8" cy="12" r="3.4" fill="none" stroke="currentColor" stroke-width="2"/><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M11.5 12H21M17.5 12v3.5M14 12v2.5"/></symbol>
  <symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2.5" fill="none" stroke="currentColor" stroke-width="2"/><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M5 15V6a2 2 0 0 1 2-2h9"/></symbol>
  <symbol id="i-dots" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.8" fill="currentColor"/><circle cx="12" cy="12" r="1.8" fill="currentColor"/><circle cx="19" cy="12" r="1.8" fill="currentColor"/></symbol>
</svg>

<div id="app">
  <aside id="sidebar">
    <div class="logo-row">
      <svg class="logo"><use href="#i-star"/></svg><span class="logo-text">Gemini</span>
    </div>
    <button class="new-chat" id="newChatBtn"><svg class="ic"><use href="#i-pen"/></svg> Новый чат</button>
    <div class="nav-label"><span>Все чаты</span></div>
    <div class="chat-list" id="chatList"></div>
    <div class="side-bottom">
      <button class="side-link" id="keysBtn"><svg class="ic"><use href="#i-key"/></svg> API-ключи</button>
      <button class="side-link" id="setBtn"><svg class="ic"><use href="#i-gear"/></svg> Настройки</button>
      <div class="profile"><div class="avatar" id="avatar">G</div><span id="profileName">Ключ не выбран</span></div>
    </div>
  </aside>

  <main id="main" class="empty">
    <div id="messages"><div class="col" id="msgCol"></div></div>
    <div id="hero"><h1>С чего начнём?</h1></div>
    <div id="composerWrap">
      <div id="chips" hidden></div>
      <div id="composer">
        <button class="round-btn" id="attachBtn" title="Прикрепить файлы"><svg class="ic"><use href="#i-plus"/></svg></button>
        <textarea id="input" rows="1" placeholder="Спросите Gemini…"></textarea>
        <button class="model-btn" id="modelBtn"><span id="modelLabel"></span><svg class="ic" style="width:16px;height:16px"><use href="#i-caret"/></svg></button>
        <button class="round-btn" id="sendBtn" title="Отправить"><svg class="ic"><use href="#i-up"/></svg></button>
        <button class="round-btn" id="stopBtn" title="Остановить" hidden><svg class="ic"><use href="#i-stop"/></svg></button>
      </div>
      <div class="hint">Gemini может ошибаться. Код выполняется в песочнице Google. Чаты хранятся в вашем браузере.</div>
    </div>
  </main>
</div>

<input type="file" id="fileInput" multiple hidden>
<div class="menu" id="modelMenu" hidden></div>
<div class="menu" id="ctxMenu" hidden></div>
<div id="toast" hidden></div>

<dialog id="keysDlg">
  <h2>API-ключи Gemini</h2>
  <div id="keysList"></div>
  <label>Добавить ключ</label>
  <div class="dlg-row">
    <input id="keyName" placeholder="Название (личный…)">
    <input id="keyValue" placeholder="AIza…">
    <button class="btn primary" id="keyAdd" type="button">Добавить</button>
  </div>
  <div class="dlg-actions">
    <button class="btn" id="keyTest" type="button">Проверить выбранный</button>
    <button class="btn" id="keysClose" type="button">Закрыть</button>
  </div>
</dialog>

<dialog id="setDlg">
  <h2>Настройки генерации</h2>
  <label>Системная инструкция</label>
  <textarea id="setSystem" rows="4" placeholder="Например: отвечай кратко и по-русски"></textarea>
  <label>Temperature: <span id="tempVal"></span></label>
  <input id="setTemp" type="range" min="0" max="2" step="0.1">
  <label class="checkline"><input type="checkbox" id="setCodeExec">
    Выполнение кода (Python) в песочнице Gemini — модели 2.x</label>
  <div class="dlg-actions">
    <button class="btn" id="setCancel" type="button">Отмена</button>
    <button class="btn primary" id="setSave" type="button">Сохранить</button>
  </div>
</dialog>

<script>
/* ==== САМОДИАГНОСТИКА: любая ошибка JS видна красной плашкой сверху ==== */
window.addEventListener("error", function(e){
  var d=document.getElementById("jserr");
  if(d){ d.style.display="block";
    d.textContent="Ошибка JS: "+e.message+" (строка "+e.lineno+")\nЕсли плашка появилась — пришлите этот текст разработчику."; }
});
window.addEventListener("unhandledrejection", function(e){
  var d=document.getElementById("jserr");
  if(d){ d.style.display="block"; d.textContent="Ошибка JS (promise): "+(e.reason && e.reason.message || e.reason); }
});

"use strict";
const API = "https://generativelanguage.googleapis.com/v1beta";

/* ================= хранилище ================= */
const LS = {
  get(k,d){ try{ const v = localStorage.getItem(k); return v==null? d : JSON.parse(v); }catch(e){ return d; } },
  set(k,v){ localStorage.setItem(k, JSON.stringify(v)); }
};
let keys      = LS.get("g_keys", []);
let selKey    = LS.get("g_sel_key", "");
let chats     = LS.get("g_chats", []);
let settings  = Object.assign(
  { model:"gemini-2.5-flash", models:["gemini-2.5-flash","gemini-2.5-pro","gemini-2.0-flash"],
    system:"", temperature:0.7, codeExec:true },
  LS.get("g_settings", {}));
if(!Array.isArray(settings.models) || !settings.models.length)
  settings.models=["gemini-2.5-flash","gemini-2.5-pro","gemini-2.0-flash"];
if(!Array.isArray(chats)) chats=[];
if(!Array.isArray(keys)) keys=[];

let current = null;
let attachments = [];
let streaming = null;

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function toast(msg){ const t=$("toast"); t.textContent=msg; t.hidden=false; clearTimeout(t._h); t._h=setTimeout(()=>t.hidden=true, 4000); }
function persistSettings(){ LS.set("g_settings", settings); }
function persistKeys(){ LS.set("g_keys", keys); LS.set("g_sel_key", selKey); }
function persistChats(){
  try{ LS.set("g_chats", chats); }
  catch(e){
    chats.forEach(c=>c.messages.forEach(m=>(m.files||[]).forEach(f=>{ if(f.dataUrl && f.dataUrl.length>400000){ delete f.dataUrl; f.lost=true; } })));
    try{ LS.set("g_chats", chats); toast("Хранилище переполнено: крупные вложения не сохранены в истории"); }catch(e2){}
  }
}
const curKey = () => keys.find(k=>k.name===selKey) || null;

/* ==== полифил <dialog> для старых браузеров ==== */
(function(){
  const probe=document.createElement("dialog");
  if(typeof probe.showModal==="function") return;
  document.querySelectorAll("dialog").forEach(dlg=>{
    dlg.showModal=function(){
      dlg.setAttribute("open","");
      dlg.style.position="fixed"; dlg.style.zIndex=100;
      dlg.style.top="50%"; dlg.style.left="50%"; dlg.style.transform="translate(-50%,-50%)";
      dlg.style.display="block";
    };
    dlg.close=function(){ dlg.removeAttribute("open"); dlg.style.display="none"; };
  });
})();

/* ================= рендеринг ================= */
const CDN = {
  marked:  ["https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js","https://unpkg.com/marked@12.0.2/marked.min.js","https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"],
  katexCs: ["https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css","https://unpkg.com/katex@0.16.11/dist/katex.min.css","https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.11/katex.min.css"],
  katex:   ["https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js","https://unpkg.com/katex@0.16.11/dist/katex.min.js","https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.11/katex.min.js"],
};
function loadScript(urls){ return new Promise(res=>{ let i=0; const next=()=>{ if(i>=urls.length) return res(false);
  const s=document.createElement("script"); s.src=urls[i++]; s.onload=()=>res(true); s.onerror=next; document.head.appendChild(s); }; next(); }); }
function loadCss(urls){ return new Promise(res=>{ let i=0; const next=()=>{ if(i>=urls.length) return res(false);
  const l=document.createElement("link"); l.rel="stylesheet"; l.href=urls[i++]; l.onload=()=>res(true); l.onerror=next; document.head.appendChild(l); }; next(); }); }
loadCss(CDN.katexCs);
Promise.all([loadScript(CDN.marked), loadScript(CDN.katex)]).then(()=>{
  if(!window.marked) toast("CDN недоступен — включён встроенный мини-рендер Markdown");
});

function fallbackMd(s){
  const out=[];
  for(const part of s.split(/(```[\w+\-]*\n[\s\S]*?```)/g)){
    if(part.startsWith("```")){ const nl=part.indexOf("\n");
      out.push("<pre><code>"+esc(part.slice(nl+1).replace(/\n?```$/,""))+"</code></pre>"); continue; }
    out.push(esc(part)
      .replace(/^### (.*)$/gm,"<h3>$1</h3>").replace(/^## (.*)$/gm,"<h2>$1</h2>").replace(/^# (.*)$/gm,"<h1>$1</h1>")
      .replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>").replace(/\*([^*]+)\*/g,"<em>$1</em>")
      .replace(/`([^`]+)`/g,"<code>$1</code>")
      .replace(/((?:^[-•] .*(?:\n|$))+)/gm, m=>"<ul>"+m.replace(/^[-•] (.*)$/gm,"<li>$1</li>")+"</ul>")
      .replace(/\n/g,"<br>"));
  }
  return out.join("");
}
function mdToHtml(text){
  const maths=[]; let s=String(text);
  const codeStore=[];
  s=s.replace(/```([\w+\-]*)[ \t]*\n([\s\S]*?)```/g,(m,l,c)=>{ codeStore.push("```"+l+"\n"+c+"```"); return "\u0000C"+(codeStore.length-1)+"\u0000"; });
  s=s.replace(/`([^`\n]+)`/g,(m,c)=>{ codeStore.push("`"+c+"`"); return "\u0000C"+(codeStore.length-1)+"\u0000"; });
  s=s.replace(/\$\$([\s\S]+?)\$\$/g,(m,t)=>{ maths.push({t,d:true});  return "\u0000M"+(maths.length-1)+"\u0000"; });
  s=s.replace(/\$([^\n$]+?)\$/g,(m,t)=>{ maths.push({t,d:false}); return "\u0000M"+(maths.length-1)+"\u0000"; });
  s=s.replace(/\u0000C(\d+)\u0000/g,(m,i)=>"\n"+codeStore[+i]+"\n");
  let html = window.marked ? window.marked.parse(s,{breaks:true,gfm:true}) : fallbackMd(s);
  html = html.replace(/\u0000M(\d+)\u0000/g,(m,i)=>{
    const {t,d}=maths[+i];
    if(window.katex){ try{ return katex.renderToString(t.trim(),{displayMode:d,throwOnError:false}); }catch(e){} }
    return '<code class="inline-code">'+esc(t)+"</code>";
  });
  return html;
}
function decorate(el){
  el.querySelectorAll("pre").forEach(pre=>{
    if(pre.dataset.cd) return; pre.dataset.cd="1";
    const b=document.createElement("button"); b.className="copy-btn"; b.textContent="Копировать";
    b.onclick=()=>{ const clone=pre.cloneNode(true); clone.querySelectorAll(".copy-btn").forEach(x=>x.remove());
      navigator.clipboard.writeText(clone.innerText).catch(()=>{});
      b.textContent="Скопировано ✓"; setTimeout(()=>b.textContent="Копировать",1400); };
    pre.appendChild(b);
  });
}
function execCodeHtml(s){
  return '<div class="exec-wrap"><div class="exec-head">🐍 Python · код выполняется в песочнице Gemini</div>'+
         '<pre><code>'+esc(s.code)+'</code></pre></div>';
}
function execResultHtml(s){
  const ok=String(s.outcome||"").includes("OK");
  return '<div class="exec-wrap"><div class="exec-head">Вывод выполнения'+
         '<span class="exec-badge '+(ok?"ok":"fail")+'">'+esc(s.outcome||"RESULT")+'</span></div>'+
         '<div class="exec-out'+(ok?"":" fail")+'">'+esc(s.output||"(пусто)")+'</div></div>';
}
function partsToHtml(segs, live){
  let html="";
  for(const s of segs){
    if(s.type==="text")       html += s.text ? mdToHtml(s.text) : "";
    else if(s.type==="code")  html += execCodeHtml(s);
    else if(s.type==="result")html += execResultHtml(s);
  }
  return html + (live?'<span class="cursor"></span>':"");
}
const textOf = segs => segs.map(s=>
    s.type==="text" ? s.text :
    s.type==="code" ? ("```python\n"+s.code+"\n```") :
    ("```\n"+(s.output||"")+"\n```")).join("\n\n");
const segsOf = m => (m.parts && m.parts.length) ? m.parts : [{type:"text", text:m.text||""}];
function fillParts(el, segs, live){ el.innerHTML = partsToHtml(segs, live); decorate(el); }

/* ================= сообщения ================= */
function setEmpty(v){ $("main").classList.toggle("empty", v); }
function scrollBottom(){ const m=$("messages"); m.scrollTop=m.scrollHeight; }
function appendUser(msg){
  const wrap=document.createElement("div"); wrap.className="msg-user";
  const bubble=document.createElement("div"); bubble.className="bubble";
  const files=(msg.files||[]).filter(f=>f.dataUrl||!f.lost);
  if(files.length){
    const th=document.createElement("div"); th.className="thumbs";
    files.forEach(f=>{
      if(f.mime&&f.mime.startsWith("image/")&&f.dataUrl){ const im=document.createElement("img"); im.src=f.dataUrl; th.appendChild(im); }
      else{ const c=document.createElement("span"); c.className="fchip"; c.textContent="📄 "+f.name; th.appendChild(c); }
    });
    bubble.appendChild(th);
  }
  if(msg.text) bubble.appendChild(document.createTextNode(msg.text));
  wrap.appendChild(bubble); $("msgCol").appendChild(wrap); scrollBottom();
}
function appendModel(segs){
  const wrap=document.createElement("div"); wrap.className="msg-model";
  const content=document.createElement("div"); content.className="content";
  const acts=document.createElement("div"); acts.className="acts";
  const cp=document.createElement("button"); cp.title="Копировать ответ";
  cp.innerHTML='<svg class="ic" style="width:17px;height:17px"><use href="#i-copy"/></svg>';
  cp.onclick=()=>navigator.clipboard.writeText(content._raw||"").catch(()=>{});
  acts.appendChild(cp);
  wrap.appendChild(content); wrap.appendChild(acts);
  $("msgCol").appendChild(wrap);
  const has = segs && segs.some(s=>(s.text||s.code||s.output));
  content._raw = has ? textOf(segs) : "";
  if(has) fillParts(content, segs, false); else content.innerHTML='<div class="thinking">✦</div>';
  scrollBottom();
  return content;
}
function renderMessages(){
  $("msgCol").innerHTML="";
  if(!current) return;
  current.messages.forEach(m=> m.role==="user" ? appendUser(m) : appendModel(segsOf(m)));
  scrollBottom();
}

/* ================= сайдбар ================= */
function renderSidebar(){
  const list=$("chatList"); list.innerHTML="";
  [...chats].sort((a,b)=>(b.updated||0)-(a.updated||0)).forEach(c=>{
    const it=document.createElement("div"); it.className="chat-item"+(current&&current.id===c.id?" active":"");
    const t=document.createElement("span"); t.className="t"; t.textContent=c.title||"Без названия";
    const d=document.createElement("button"); d.className="dots"; d.innerHTML='<svg class="ic" style="width:16px;height:16px"><use href="#i-dots"/></svg>';
    d.onclick=e=>{ e.stopPropagation(); openCtx(c.id, d); };
    it.appendChild(t); it.appendChild(d);
    it.onclick=()=>openChat(c.id);
    list.appendChild(it);
  });
  const k=curKey();
  $("avatar").textContent = k ? k.name[0].toUpperCase() : "G";
  $("profileName").textContent = k ? k.name : "Ключ не выбран";
}
let ctxTarget=null;
function openCtx(id, anchor){
  ctxTarget=id; const m=$("ctxMenu"); m.innerHTML="";
  const r=anchor.getBoundingClientRect();
  const b1=document.createElement("button"); b1.textContent="Переименовать";
  b1.onclick=()=>{ hideMenus(); const c=chats.find(x=>x.id===ctxTarget); if(!c) return;
    const n=prompt("Новое название:", c.title); if(n&&n.trim()){ c.title=n.trim().slice(0,70); persistChats(); renderSidebar(); } };
  const b2=document.createElement("button"); b2.textContent="Удалить";
  b2.onclick=()=>{ hideMenus(); if(!confirm("Удалить чат?")) return;
    chats=chats.filter(x=>x.id!==ctxTarget); persistChats();
    if(current&&current.id===ctxTarget) newChat();
    renderSidebar(); };
  m.appendChild(b1); m.appendChild(b2);
  m.hidden=false; m.style.left=Math.min(r.right-180, innerWidth-200)+"px"; m.style.top=(r.bottom+6)+"px";
}
function newChat(){ current=null; attachments=[]; renderChips(); $("msgCol").innerHTML=""; setEmpty(true); renderSidebar(); updateSend(); }
function openChat(id){
  if(streaming) return;
  const c=chats.find(x=>x.id===id); if(!c) return;
  current=c; setEmpty(false); renderMessages(); renderSidebar();
}

/* ================= вложения ================= */
$("attachBtn").onclick=()=>$("fileInput").click();
$("fileInput").onchange=e=>{
  for(const f of e.target.files){
    if(f.size>18*1024*1024){ toast(f.name+": больше 18 МБ, пропущен"); continue; }
    const rd=new FileReader();
    rd.onload=()=>{ attachments.push({name:f.name, mime:f.type||"application/octet-stream", dataUrl:rd.result}); renderChips(); updateSend(); };
    rd.readAsDataURL(f);
  }
  e.target.value="";
};
function renderChips(){
  const box=$("chips"); box.innerHTML=""; box.hidden=!attachments.length;
  attachments.forEach((a,i)=>{
    const c=document.createElement("div"); c.className="chip";
    if(a.mime.startsWith("image/")){ const im=document.createElement("img"); im.src=a.dataUrl; c.appendChild(im); }
    const n=document.createElement("span"); n.textContent=a.name; c.appendChild(n);
    const x=document.createElement("button"); x.textContent="✕";
    x.onclick=()=>{ attachments.splice(i,1); renderChips(); updateSend(); };
    c.appendChild(x); box.appendChild(c);
  });
}

/* ================= модели ================= */
function updateModelLabel(){ $("modelLabel").textContent=settings.model; }
$("modelBtn").onclick=e=>{
  e.stopPropagation();
  const m=$("modelMenu"); m.innerHTML="";
  settings.models.forEach(name=>{
    const b=document.createElement("button"); b.textContent=name; if(name===settings.model) b.className="sel";
    b.onclick=()=>{ settings.model=name; persistSettings(); updateModelLabel(); hideMenus(); };
    m.appendChild(b);
  });
  const sep=document.createElement("div"); sep.className="sep"; m.appendChild(sep);
  const add=document.createElement("button"); add.textContent="＋ Добавить модель…";
  add.onclick=()=>{ hideMenus(); const n=prompt("ID модели (например, gemini-flash-latest):");
    if(n&&n.trim()){ const v=n.trim(); if(!settings.models.includes(v)) settings.models.unshift(v);
      settings.model=v; persistSettings(); updateModelLabel(); } };
  const ref=document.createElement("button"); ref.textContent="⟳ Обновить список из API";
  ref.onclick=async()=>{ hideMenus(); await fetchModels(true); };
  m.appendChild(add); m.appendChild(ref);
  m.hidden=false;
  const r=$("modelBtn").getBoundingClientRect();
  requestAnimationFrame(()=>{ m.style.left=Math.max(8,r.right-m.offsetWidth)+"px"; m.style.top=Math.max(8,r.top-m.offsetHeight-10)+"px"; });
};
async function fetchModels(announce){
  const k=curKey(); if(!k){ toast("Сначала добавьте API-ключ"); return; }
  try{
    const r=await fetch(API+"/models?pageSize=200&key="+encodeURIComponent(k.key));
    if(!r.ok) throw new Error("HTTP "+r.status);
    const j=await r.json();
    const names=(j.models||[]).filter(m=>(m.supportedGenerationMethods||[]).includes("generateContent"))
      .map(m=>m.name.replace("models/","")).sort().reverse();
    names.forEach(n=>{ if(!settings.models.includes(n)) settings.models.push(n); });
    persistSettings(); if(announce) toast("Список моделей обновлён: "+names.length);
  }catch(err){ toast("Не удалось загрузить модели: "+err.message); }
}
function hideMenus(){ $("modelMenu").hidden=true; $("ctxMenu").hidden=true; }
document.addEventListener("click", e=>{ if(!e.target.closest(".menu")) hideMenus(); });

/* ================= ввод / отправка ================= */
const ta=$("input");
function autoGrow(){ ta.style.height="auto"; ta.style.height=Math.min(ta.scrollHeight,200)+"px"; }
function updateSend(){ $("sendBtn").classList.toggle("on", !streaming && (ta.value.trim()||attachments.length)); }
ta.addEventListener("input", ()=>{ autoGrow(); updateSend(); });
ta.addEventListener("keydown", e=>{ if(e.key==="Enter"&&!e.shiftKey){ e.preventDefault(); send(); } });
$("sendBtn").onclick=send;
$("stopBtn").onclick=()=>{ if(streaming){ streaming.stopped=true; streaming.ctrl.abort(); } };
function setStreaming(v){
  $("sendBtn").hidden=v; $("stopBtn").hidden=!v;
  if(!v) updateSend();
}
function buildContents(chat){
  const contents=[];
  for(const m of chat.messages){
    const parts=[];
    for(const f of (m.files||[])){
      if(!f.dataUrl) continue;
      parts.push({inline_data:{mime_type:f.mime, data:f.dataUrl.split(",")[1]}});
    }
    if(m.role==="user"){ if(m.text) parts.push({text:m.text}); }
    else{
      for(const s of segsOf(m)){
        if(s.type==="text" && s.text) parts.push({text:s.text});
        else if(s.type==="code")   parts.push({executableCode:{language:s.language||"PYTHON", code:s.code}});
        else if(s.type==="result") parts.push({codeExecutionResult:{outcome:s.outcome||"OUTCOME_OK", output:s.output||""}});
      }
    }
    if(parts.length) contents.push({role:m.role, parts});
  }
  return contents;
}
async function send(){
  if(streaming) return;
  const text=ta.value.trim();
  if(!text&&!attachments.length) return;
  const k=curKey();
  if(!k){ toast("Добавьте API-ключ (кнопка «API-ключи» слева)"); $("keysDlg").showModal(); return; }
  if(!current){
    current={ id:Date.now().toString(36)+Math.random().toString(36).slice(2,7),
      title:"Новый чат", updated:Date.now(), messages:[] };
    chats.push(current);
  }
  const msg={ role:"user", text,
    files: attachments.map(a=> a.dataUrl.length<1500000
      ? {name:a.name, mime:a.mime, dataUrl:a.dataUrl}
      : {name:a.name, mime:a.mime, dataUrl:a.dataUrl, big:true}) };
  current.messages.push(msg);
  if(current.title==="Новый чат"&&text) current.title=text.split("\n")[0].slice(0,60);
  current.updated=Date.now();
  persistChats(); renderSidebar();
  appendUser(msg);
  msg.files.forEach(f=>{ if(f.big){ delete f.dataUrl; f.lost=true; } });
  attachments=[]; renderChips(); ta.value=""; autoGrow(); setEmpty(false);
  await streamReply(k);
}
async function streamReply(keyObj){
  const contentEl=appendModel(null);
  const st=streaming={ ctrl:new AbortController(), segs:[], stopped:false, contentEl };
  setStreaming(true);
  let errorMsg=null, renderTimer=null;
  const schedule=()=>{ if(renderTimer) return; renderTimer=setTimeout(()=>{ renderTimer=null;
      fillParts(contentEl, st.segs, true); contentEl._raw=textOf(st.segs); scrollBottom(); }, 90); };
  const pushText=t=>{ const L=st.segs[st.segs.length-1];
    if(L&&L.type==="text") L.text+=t; else st.segs.push({type:"text",text:t}); };
  const pushCode=c=>{ const L=st.segs[st.segs.length-1];
    if(L&&L.type==="code") L.code+=c; else st.segs.push({type:"code",code:c,language:"PYTHON"}); };
  const pushResult=r=>{ const L=st.segs[st.segs.length-1];
    if(L&&L.type==="result"){ L.outcome=r.outcome||L.outcome; L.output=(L.output||"")+(r.output||""); }
    else st.segs.push({type:"result",outcome:r.outcome,output:r.output||""}); };
  try{
    const payload={ contents:buildContents(current), generationConfig:{temperature:settings.temperature} };
    if(settings.system) payload.systemInstruction={parts:[{text:settings.system}]};
    if(settings.codeExec!==false) payload.tools=[{code_execution:{}}];
    const resp=await fetch(API+"/models/"+encodeURIComponent(settings.model)+":streamGenerateContent?alt=sse", {
      method:"POST",
      headers:{ "Content-Type":"application/json", "x-goog-api-key":keyObj.key },
      body:JSON.stringify(payload),
      signal:st.ctrl.signal,
    });
    if(!resp.ok){
      let m=""; try{ m=(await resp.json()).error.message; }catch(e){ m=await resp.text(); }
      throw new Error("HTTP "+resp.status+": "+m);
    }
    const reader=resp.body.getReader(); const dec=new TextDecoder(); let buf="";
    while(true){
      const {done,value}=await reader.read(); if(done) break;
      buf+=dec.decode(value,{stream:true});
      let i;
      while((i=buf.indexOf("\n"))!==-1){
        const line=buf.slice(0,i).trim(); buf=buf.slice(i+1);
        if(!line.startsWith("data:")) continue;
        const raw=line.slice(5).trim(); if(!raw) continue;
        let obj; try{ obj=JSON.parse(raw); }catch(e){ continue; }
        if(obj.error) throw new Error(obj.error.message);
        const cands=obj.candidates||[];
        if(!cands.length){
          if(obj.promptFeedback&&obj.promptFeedback.blockReason) throw new Error("Запрос заблокирован: "+obj.promptFeedback.blockReason);
          continue;
        }
        for(const p of ((cands[0].content&&cands[0].content.parts)||[])){
          if(p.text) pushText(p.text);
          else if(p.executableCode) pushCode(p.executableCode.code||"");
          else if(p.codeExecutionResult) pushResult(p.codeExecutionResult);
        }
        if(st.segs.length) schedule();
      }
    }
  }catch(err){
    if(!(st.stopped || (err && err.name==="AbortError"))) errorMsg=err.message||String(err);
    if(errorMsg && location.protocol==="file:" && /fetch|network|cors|networkerror/i.test(errorMsg))
      errorMsg+=" — браузер блокирует запрос с file://. Запустите: python -m http.server и откройте http://localhost:8000/";
  }
  if(renderTimer){ clearTimeout(renderTimer); renderTimer=null; }
  setStreaming(false); streaming=null;
  const has=st.segs.some(s=>(s.text||s.code||s.output));
  if(errorMsg){
    contentEl.innerHTML='<div class="err">⚠️ '+esc(errorMsg)+"</div>";
    if(has){ current.messages.push({role:"model", parts:st.segs, text:textOf(st.segs)}); persistChats(); }
  }else if(has){
    fillParts(contentEl, st.segs, false); contentEl._raw=textOf(st.segs);
    current.messages.push({role:"model", parts:st.segs, text:textOf(st.segs)});
    current.updated=Date.now(); persistChats(); renderSidebar();
  }else{
    contentEl.innerHTML='<div class="err">Модель вернула пустой ответ (возможно, фильтры безопасности).</div>';
  }
  scrollBottom(); updateSend();
}

/* ================= ключи / настройки ================= */
function renderKeys(){
  const box=$("keysList"); box.innerHTML="";
  if(!keys.length) box.innerHTML='<div style="color:var(--dim);font-size:13px;padding:4px 2px">Ключей пока нет. Получите: aistudio.google.com/apikey</div>';
  keys.forEach(k=>{
    const row=document.createElement("div"); row.className="key-row"+(k.name===selKey?" sel":"");
    const n=document.createElement("span"); n.className="n"; n.textContent=k.name;
    const kk=document.createElement("span"); kk.className="k"; kk.textContent=k.key.slice(0,6)+"…"+k.key.slice(-4);
    const use=document.createElement("button"); use.textContent="выбрать";
    use.onclick=()=>{ selKey=k.name; persistKeys(); renderKeys(); renderSidebar(); };
    const del=document.createElement("button"); del.textContent="✕";
    del.onclick=()=>{ keys=keys.filter(x=>x.name!==k.name); if(selKey===k.name) selKey=""; persistKeys(); renderKeys(); renderSidebar(); };
    row.append(n,kk,use,del); box.appendChild(row);
  });
}
$("keysBtn").onclick=()=>{ renderKeys(); $("keysDlg").showModal(); };
$("keyAdd").onclick=()=>{
  const n=$("keyName").value.trim(), v=$("keyValue").value.trim();
  if(!n||!v) return toast("Укажите название и ключ");
  if(keys.some(k=>k.name===n)) return toast("Такое название уже есть");
  keys.push({name:n,key:v}); if(!selKey) selKey=n;
  persistKeys(); renderKeys(); renderSidebar();
  $("keyName").value=""; $("keyValue").value="";
};
$("keyTest").onclick=async()=>{
  const k=curKey(); if(!k) return toast("Сначала выберите ключ");
  try{
    const r=await fetch(API+"/models?pageSize=1&key="+encodeURIComponent(k.key));
    toast(r.ok? "Ключ работает ✓" : "Ошибка: HTTP "+r.status);
  }catch(e){ toast("Ошибка: "+e.message); }
};
$("keysClose").onclick=()=>$("keysDlg").close();

$("setBtn").onclick=()=>{
  $("setSystem").value=settings.system; $("setTemp").value=settings.temperature;
  $("tempVal").textContent=settings.temperature;
  $("setCodeExec").checked = settings.codeExec!==false;
  $("setDlg").showModal();
};
$("setTemp").oninput=e=>$("tempVal").textContent=e.target.value;
$("setSave").onclick=()=>{
  settings.system=$("setSystem").value.trim();
  settings.temperature=parseFloat($("setTemp").value);
  settings.codeExec=$("setCodeExec").checked;
  persistSettings(); $("setDlg").close();
};
$("setCancel").onclick=()=>$("setDlg").close();

/* ================= старт ================= */
$("newChatBtn").onclick=()=>{ if(!streaming) newChat(); };
updateModelLabel(); renderSidebar(); updateSend(); autoGrow();
</script>
